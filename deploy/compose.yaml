# Runs clankjob from the published image; nothing to build. See deploy/README.md.
#
# Written by the image's setup and replaced by every update, so never edit it: put
# changes in compose.override.yaml, which docker compose merges in by itself. Your values
# come from .env: CLANKJOB_TAG (image tag), CLANKJOB_PORT, UID and GID, and the secrets.
#
#   docker compose up -d            # start
#   ./update                        # pull the image, refresh this file, restart
#   docker compose logs -f          # follow the log

services:
  clankjob:
    image: ghcr.io/uintptr/clankjob:${CLANKJOB_TAG:-latest}
    restart: unless-stopped
    # Resolve names (LLM API, mail servers, Discord…) with Cloudflare's DNS rather than
    # the host's, which some Docker setups cannot reach from containers.
    dns:
      - 1.1.1.1
    # Longer than shutdown_grace in clankjob.toml, so running LLM calls can finish.
    stop_grace_period: 60s
    # The owner of this directory, so the server can write ./data.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # A reverse proxy with TLS (Caddy, nginx…) in front serves public_url.
      - "127.0.0.1:${CLANKJOB_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # clankjob.toml, and plugins/<id>.toml for each plugin you configured.
      - ./config:/config:ro
      - ./data:/data
      # Your own plugins, if any; they replace bundled ones of the same id.
      - ./plugins:/plugins:ro
      # Your prompt overrides and profiles.
      - ./prompts:/prompts:ro

  # The agent's shell (plugin/shell): the same image running sandbox/sandboxd.py, with
  # none of the server's secrets, data or settings. It runs whatever the agent asks, as
  # the image's unprivileged user, with internet access; /work keeps its files. No
  # ports: only the server reaches it, on this compose network.
  sandbox:
    image: ghcr.io/uintptr/clankjob:${CLANKJOB_TAG:-latest}
    restart: unless-stopped
    dns:
      - 1.1.1.1
    entrypoint: ["/usr/bin/tini", "--", "python3", "/usr/local/lib/clankjob/sandboxd.py"]
    environment:
      HOME: /work
      UV_CACHE_DIR: /work/.cache/uv
      # nmap: use the raw sockets its file capability allows (SYN scans, OS detection).
      NMAP_PRIVILEGED: "1"
    volumes:
      - sandbox-work:/work
    # Deliberately no env_file, no /data, /config, /plugins config or /run/secrets.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s

  # Optional: start cases from Discord (intake/discord). A message that @mentions its bot,
  # from an allowed user, becomes a case. It only talks to the server's REST API; the
  # Discord plugin keeps handling questions. Off unless COMPOSE_PROFILES=discord-intake
  # is in .env, with the DISCORD_INTAKE_* settings below.
  discord-intake:
    image: ghcr.io/uintptr/clankjob:${CLANKJOB_TAG:-latest}
    profiles: ["discord-intake"]
    restart: unless-stopped
    dns:
      - 1.1.1.1
    entrypoint: ["/usr/bin/tini", "--", "python3", "/usr/local/lib/clankjob/discord_intake.py"]
    # Only its own settings, not the whole .env: it never sees the LLM or email secrets.
    environment:
      CLANKJOB_URL: http://clankjob:8080
      CLANKJOB_TOKEN: ${CLANKJOB_TOKEN:-}
      CLANKJOB_PUBLIC_URL: ${CLANKJOB_PUBLIC_URL:-}
      DISCORD_INTAKE_TOKEN: ${DISCORD_INTAKE_TOKEN:-}
      DISCORD_INTAKE_CHANNEL_ID: ${DISCORD_INTAKE_CHANNEL_ID:-}
      DISCORD_INTAKE_ALLOWED_USERS: ${DISCORD_INTAKE_ALLOWED_USERS:-}
      DISCORD_INTAKE_HUMAN_CHANNELS: ${DISCORD_INTAKE_HUMAN_CHANNELS:-}
    volumes:
      - intake-state:/state
    healthcheck:
      disable: true

volumes:
  sandbox-work:
  intake-state:
