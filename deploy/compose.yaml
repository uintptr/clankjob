# Run clankjob from the published image; nothing to build. See deploy/README.md.
#
#   docker compose up -d                        # start (pulls the image the first time)
#   docker compose pull && docker compose up -d # update
#   docker compose logs -f                      # follow the log
#
# Next to this file: clankjob.toml (settings), .env (secrets), data/ (created by you, so
# it belongs to your user), and a config file per plugin you use.

services:
  clankjob:
    image: ghcr.io/uintptr/clankjob:latest
    restart: unless-stopped
    # Longer than shutdown_grace in clankjob.toml, so running LLM calls can finish.
    stop_grace_period: 60s
    # Must own ./data (run `mkdir data` before the first start).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # A reverse proxy with TLS (Caddy, nginx…) in front serves public_url.
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./clankjob.toml:/config/clankjob.toml:ro
      - ./data:/data
      # Settings of the bundled plugins you use; the file must exist, so keep only the
      # lines of plugins you configured:
      # - ./plugins/email.toml:/plugins/email/config.toml:ro
      # - ./plugins/discord.toml:/plugins/discord/config.toml:ro
      # - ./plugins/youtube_transcribe.toml:/plugins/youtube_transcribe/config.toml:ro
      # Your own prompt overrides and profiles:
      # - ./prompts:/prompts:ro
