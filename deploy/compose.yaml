# Run clankjob from the published image; nothing to build. See deploy/README.md.
#
#   docker compose up -d                        # start (pulls the image the first time)
#   docker compose pull && docker compose up -d # update
#   docker compose logs -f                      # follow the log
#
# Next to this file: clankjob.toml (settings), .env (secrets), data/ (created by you, so
# it belongs to your user), and a config file per plugin you use.

services:
  clankjob:
    image: ghcr.io/uintptr/clankjob:latest
    restart: unless-stopped
    # Resolve names (LLM API, mail servers, Discord…) with Cloudflare's DNS rather than
    # the host's, which some Docker setups cannot reach from containers.
    dns:
      - 1.1.1.1
    # Longer than shutdown_grace in clankjob.toml, so running LLM calls can finish.
    stop_grace_period: 60s
    # Must own ./data (run `mkdir data` before the first start).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # A reverse proxy with TLS (Caddy, nginx…) in front serves public_url.
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./clankjob.toml:/config/clankjob.toml:ro
      - ./data:/data
      # Settings of the bundled plugins you use; the file must exist, so keep only the
      # lines of plugins you configured:
      # - ./plugins/email.toml:/plugins/email/config.toml:ro
      # - ./plugins/discord.toml:/plugins/discord/config.toml:ro
      # - ./plugins/youtube_transcribe.toml:/plugins/youtube_transcribe/config.toml:ro
      # - ./plugins/shell.toml:/plugins/shell/config.toml:ro
      # Your own prompt overrides and profiles:
      # - ./prompts:/prompts:ro

  # The agent's shell (plugin/shell): the same image running sandbox/sandboxd.py, with
  # none of the server's secrets, data or settings. It runs whatever the agent asks, as
  # the image's unprivileged user, with internet access; /work keeps its files. No
  # ports: only the server reaches it, on this compose network.
  sandbox:
    image: ghcr.io/uintptr/clankjob:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
    entrypoint: ["/usr/bin/tini", "--", "python3", "/usr/local/lib/clankjob/sandboxd.py"]
    environment:
      HOME: /work
      UV_CACHE_DIR: /work/.cache/uv
    volumes:
      - sandbox-work:/work
    # Deliberately no env_file, no /data, /config, /plugins config or /run/secrets.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s

volumes:
  sandbox-work:
