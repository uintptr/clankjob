<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ralph</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* One HTML file, no framework, no build step, no CDN (PROJECT_SPECS.md §10.4).
     Two layouts: a rail + reply pane from 880px up, one screen at a time below. */
  :root {
    --bg:#F3F4F6; --card:#FFFFFF; --card2:#F6F7F9;
    --ink:#16191F; --ink2:#3B4250; --muted:#5C6675;
    --line:#E1E4E9; --line2:#C9CED6; --border-in:#8A96A5;
    --accent:#1F5F9E; --accent-soft:#E6EFF8; --on-accent:#FFFFFF;
    --await:#8A4B00; --await-soft:#FBEFD9;
    --live:#0F6B6B;  --live-soft:#DDF1F0;
    --human:#A12B33; --human-soft:#FBE7E8;
    --done:#1F6B45;  --done-soft:#E1F2E8;
    --off:#5B6472;   --off-soft:#ECEEF1;
    --on-human:#FFFFFF;
    --shadow:0 1px 2px rgba(22,25,31,.06), 0 0 0 1px rgba(22,25,31,.03);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --bar-h:52px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0F1216; --card:#171B21; --card2:#1E232B;
    --ink:#E8ECF2; --ink2:#C3CAD5; --muted:#98A2B3;
    --line:#2A313B; --line2:#3A434F; --border-in:#5F6B7A;
    --accent:#7CB4EA; --accent-soft:#1A2A3B; --on-accent:#0D1319;
    --await:#F0B35E; --await-soft:#2F2415;
    --live:#6FD0CF;  --live-soft:#123232;
    --human:#F08B93; --human-soft:#33191C;
    --done:#7BCB9F;  --done-soft:#15291E;
    --off:#98A2B3;   --off-soft:#232A33;
    --on-human:#1A0B0D;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
    color-scheme:dark;
  } }
  :root[data-theme="dark"] {
    --bg:#0F1216; --card:#171B21; --card2:#1E232B;
    --ink:#E8ECF2; --ink2:#C3CAD5; --muted:#98A2B3;
    --line:#2A313B; --line2:#3A434F; --border-in:#5F6B7A;
    --accent:#7CB4EA; --accent-soft:#1A2A3B; --on-accent:#0D1319;
    --await:#F0B35E; --await-soft:#2F2415;
    --live:#6FD0CF;  --live-soft:#123232;
    --human:#F08B93; --human-soft:#33191C;
    --done:#7BCB9F;  --done-soft:#15291E;
    --off:#98A2B3;   --off-soft:#232A33;
    --on-human:#1A0B0D;
    color-scheme:dark;
  }

  * { box-sizing:border-box; }
  html { height:100%; } body { min-height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
         font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; }
  a { color:var(--accent); }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .skip { position:absolute; left:8px; top:-40px; background:var(--card); padding:8px 12px; z-index:30; }
  .skip:focus { top:8px; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---- buttons: one vocabulary ------------------------------------------ */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px;
         padding:6px 14px; border-radius:6px; border:1px solid var(--border-in); background:var(--card);
         color:var(--ink2); font-size:14px; font-weight:500; cursor:pointer; text-decoration:none;
         white-space:nowrap; }
  .btn:hover:not([disabled]) { background:var(--card2); border-color:var(--muted); color:var(--ink); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn.primary:hover:not([disabled]) { background:var(--accent); filter:brightness(1.08); color:var(--on-accent); }
  .btn.danger { background:var(--human); border-color:var(--human); color:var(--on-human); }
  .btn.danger:hover:not([disabled]) { background:var(--human); filter:brightness(1.08); color:var(--on-human); }
  .btn.quiet { border-color:transparent; background:transparent; color:var(--muted); }
  .btn.quiet:hover:not([disabled]) { color:var(--ink); background:var(--card2); border-color:transparent; }
  .btn.quiet.warn:hover:not([disabled]) { color:var(--human); }
  .btn.sm { min-height:30px; padding:3px 10px; font-size:13px; }
  .btn .kbd { font-family:var(--mono); font-size:11px; opacity:.7; border:1px solid currentColor;
              border-radius:3px; padding:0 4px; line-height:1.4; }

  /* ---- status bar ------------------------------------------------------- */
  .topwrap { position:sticky; top:0; z-index:20; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
         min-height:52px; padding:6px 16px; padding-top:calc(6px + env(safe-area-inset-top, 0px));
         background:var(--card); border-bottom:1px solid var(--line); }
  .brand { font-family:var(--mono); font-weight:700; font-size:17px; letter-spacing:-.01em; text-decoration:none; color:var(--ink); }
  .brand b { color:var(--accent); font-weight:700; }
  .pulse { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2); min-width:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--done); flex:none; box-shadow:0 0 0 3px var(--done-soft); }
  .dot.warn { background:var(--await); box-shadow:0 0 0 3px var(--await-soft); }
  .dot.bad { background:var(--human); box-shadow:0 0 0 3px var(--human-soft); }
  .dot.off { background:var(--off); box-shadow:0 0 0 3px var(--off-soft); }
  .pulse .sub { color:var(--muted); font-size:12.5px; }
  .counts { font-size:13px; color:var(--muted); }
  .counts b { color:var(--ink); font-weight:600; }
  .counts b.hot { color:var(--await); }
  .top-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }

  .banners { }
  .banner { display:flex; gap:10px; align-items:flex-start; padding:10px 16px; font-size:14px;
            background:var(--human-soft); color:var(--human); border-bottom:1px solid currentColor; }
  .banner.warn { background:var(--await-soft); color:var(--await); }
  .banner.info { background:var(--live-soft); color:var(--live); }
  .banner code { font-family:var(--mono); font-size:12.5px; background:rgba(0,0,0,.06); padding:1px 5px; border-radius:3px; }

  /* ---- two panes -------------------------------------------------------- */
  .app { flex:1; display:grid; grid-template-columns:minmax(300px, 360px) minmax(0, 1fr); min-height:0; }
  .rail { border-right:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; min-height:0;
          height:calc(100vh - var(--bar-h)); position:sticky; top:var(--bar-h); }
  .rail-tools { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .rail-tools input { flex:1; min-width:0; font:inherit; font-size:14px; padding:6px 10px; border-radius:6px;
                      border:1px solid var(--border-in); background:var(--card); color:var(--ink); }
  .rail-tools.file { padding-top:0; }
  .rail-list { flex:1; overflow-y:auto; padding:6px 0 24px; }
  .grp { margin-top:8px; }
  h2.grp-hh { margin:0; font:inherit; }
  .grp-h { display:flex; align-items:center; gap:8px; width:100%; min-height:36px; padding:4px 12px 4px 10px;
           background:none; border:0; text-align:left; cursor:pointer; color:var(--muted);
           font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .grp-h:hover { color:var(--ink); }
  .grp-h .n { font-variant-numeric:tabular-nums; color:var(--ink2); background:var(--card2); border-radius:10px;
              padding:0 7px; font-weight:600; letter-spacing:0; }
  .grp-h .fold { width:10px; color:var(--muted); font-size:10px; text-align:center; }
  .grp-h .split { text-transform:none; letter-spacing:0; font-weight:400; margin-left:auto; }
  .grp.folded .rows { display:none; }
  .sub-h { padding:8px 12px 2px 28px; color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .row { display:grid; grid-template-columns:4px 1fr auto; gap:2px 10px; width:100%; padding:9px 12px 9px 10px;
         border:0; border-top:1px solid var(--line); background:none; text-align:left; cursor:pointer; color:inherit; }
  .grp .rows .row:first-child { border-top:0; }
  .row:hover { background:var(--card2); }
  .row.sel { background:var(--accent-soft); }
  .row:focus-visible { outline-offset:-2px; }
  .row .bar { grid-row:1 / span 2; border-radius:2px; background:var(--off); }
  .row .bar.awaiting_approval, .row .bar.needs_review { background:var(--await); }
  .row .bar.investigating, .row .bar.approved, .row .bar.posting { background:var(--live); }
  .row .bar.needs_human { background:var(--human); }
  .row .bar.posted { background:var(--done); }
  .row .t { font-weight:600; font-size:14px; line-height:1.35; color:var(--ink);
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .row .m { grid-column:2 / span 2; font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:2px 6px; align-items:center; }
  .row .m .ch { color:var(--ink2); }
  .row .side { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .pip { display:inline-block; width:34px; height:5px; border-radius:3px; background:var(--line2); overflow:hidden; vertical-align:middle; }
  .pip i { display:block; height:100%; background:var(--accent); }
  .pip.lo i { background:var(--await); }
  .tag { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.02em; padding:1px 6px; border-radius:4px;
         background:var(--off-soft); color:var(--off); white-space:nowrap; }
  .tag.new { background:var(--await-soft); color:var(--await); }
  .tag.run { background:var(--live-soft); color:var(--live); }
  .tag.ok { background:var(--done-soft); color:var(--done); }
  .tag.bad { background:var(--human-soft); color:var(--human); }
  .rail-empty { padding:24px 16px; color:var(--muted); font-size:14px; }

  /* ---- detail pane ------------------------------------------------------ */
  .detail { min-width:0; padding:0 24px 24px; }
  .detail:focus { outline:none; }
  .detail-in { max-width:860px; }
  .back { display:none; margin:12px 0 0 -8px; }
  .dhead { padding:20px 0 12px; border-bottom:1px solid var(--line); }
  .dhead .line { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  .dhead h1 { font-size:20px; line-height:1.3; font-weight:650; margin:8px 0 6px; overflow-wrap:anywhere; }
  .dhead .meta { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13.5px; color:var(--muted); }
  .dhead .meta b { color:var(--ink2); font-weight:500; }
  .dhead .links { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.03em;
          text-transform:uppercase; padding:3px 9px; border-radius:5px; background:var(--off-soft); color:var(--off); white-space:nowrap; }
  .chip i { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.awaiting_approval, .chip.needs_review { background:var(--await-soft); color:var(--await); }
  .chip.investigating, .chip.approved, .chip.posting { background:var(--live-soft); color:var(--live); }
  .chip.needs_human { background:var(--human-soft); color:var(--human); }
  .chip.posted { background:var(--done-soft); color:var(--done); }

  .notice { display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:10px 14px; border-radius:8px; font-size:14px;
            background:var(--await-soft); color:var(--await); border:1px solid color-mix(in srgb, currentColor 35%, transparent); }
  .notice.ok { background:var(--done-soft); color:var(--done); }
  .notice.info { background:var(--live-soft); color:var(--live); }
  .notice.bad { background:var(--human-soft); color:var(--human); }
  .notice.plain { background:var(--card2); color:var(--ink2); border-color:var(--line); }
  .notice a { color:inherit; }
  .notice .mono { font-family:var(--mono); font-size:12.5px; overflow-wrap:anywhere; }
  .notice .btn { margin-left:auto; flex:none; }

  .sec { margin-top:22px; }
  .sec-h { display:flex; align-items:baseline; gap:10px; margin:0 0 8px; }
  .sec-h h2 { font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0; }
  .sec-h .hint { font-size:12.5px; color:var(--muted); }
  .sec-h .right { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }

  /* reply: a rendered preview that toggles to a textarea, never both */
  .reply .prev { padding:14px 16px; font-size:15px; line-height:1.6; overflow-wrap:anywhere; }
  .reply .prev p { margin:0 0 .8em; } .reply .prev p:last-child { margin-bottom:0; }
  .reply .prev code, .msg code, .md code { font-family:var(--mono); font-size:.88em; background:var(--card2); border:1px solid var(--line);
                                            padding:0 4px; border-radius:3px; }
  .reply .prev pre, .msg pre, .md pre { font-family:var(--mono); font-size:12.5px; background:var(--card2); border:1px solid var(--line);
                                         border-radius:6px; padding:10px 12px; overflow-x:auto; white-space:pre-wrap; margin:.6em 0; }
  .reply .prev .bcast, .msg .bcast { color:var(--human); font-weight:600; background:var(--human-soft); padding:0 3px; border-radius:3px; }
  .reply textarea { display:block; width:100%; min-height:220px; padding:14px 16px; border:0; border-radius:8px; resize:vertical;
                    font-family:var(--mono); font-size:13.5px; line-height:1.55; color:var(--ink); background:var(--card); }
  .reply textarea:focus-visible { outline-offset:-2px; }
  @media (pointer:coarse) { .reply textarea { font-family:var(--sans); font-size:16px; } }
  .reply .foot { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:8px 14px; border-top:1px solid var(--line);
                 font-size:12.5px; color:var(--muted); background:var(--card2); border-radius:0 0 8px 8px; }
  .reply .foot .over { color:var(--human); font-weight:600; }
  .reply .foot .edited { color:var(--await); font-weight:600; }
  .reply .adv.soft { color:var(--muted); }
  .reply .foot .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .reply .adv { color:var(--human); font-size:12.5px; }
  .reply.ro .prev { color:var(--ink2); }

  /* action bar: sticky to the bottom of the pane while the reply is long */
  .actbar { position:sticky; bottom:0; margin-top:16px; padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
            background:var(--bg); border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .actbar .right { margin-left:auto; display:flex; gap:8px; }
  .actbar .primary .kbd { border-color:rgba(255,255,255,.5); }
  .arm { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; width:100%; padding:10px 14px; border-radius:8px;
         background:var(--human-soft); color:var(--human); border:1px solid currentColor; font-size:14px; }
  .arm .dest { flex:1; min-width:200px; }
  .arm .dest b { font-weight:700; }
  .arm .dest small { display:block; color:var(--human); opacity:.85; font-size:12.5px; }

  .box { width:100%; padding:12px 14px; }
  .box label { display:block; font-size:13.5px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
  .box .why { font-size:12.5px; color:var(--muted); margin:-2px 0 8px; }
  .box textarea { display:block; width:100%; min-height:72px; font:inherit; font-size:14px; line-height:1.5; padding:8px 10px;
                  border:1px solid var(--border-in); border-radius:6px; background:var(--card); color:var(--ink); resize:vertical; }
  @media (pointer:coarse) {
    .box textarea, .rail-tools input { font-size:16px; }
    .rail-tools input { padding:8px 10px; }
    .btn.sm, .chipbtn { min-height:36px; }
  }
  .box .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .box select { display:block; max-width:100%; font:inherit; font-size:14px; padding:6px 8px; margin:0 0 10px;
                border:1px solid var(--border-in); border-radius:6px; background:var(--card); color:var(--ink); }
  @media (pointer:coarse) { .box select { font-size:16px; } }

  /* fix: the side track from an investigation to a draft PR */
  .fixcard .fixline { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:12px 16px; font-size:14px; }
  .fixcard .fixline .mono { font-family:var(--mono); font-size:12.5px; color:var(--muted); overflow-wrap:anywhere; }
  .fixcard .fixline .right { margin-left:auto; display:flex; gap:8px; }
  .fixcard .md { border-top:1px solid var(--line); }
  .fixcard .warn { padding:8px 16px; border-top:1px solid var(--line); font-size:13px; color:var(--human); }

  /* thread */
  .thread .msg { display:grid; grid-template-columns:1fr; gap:2px; padding:10px 14px; border-top:1px solid var(--line); }
  .thread .msg:first-child { border-top:0; }
  .thread .msg .who { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; font-size:12.5px; color:var(--muted); }
  .thread .msg .who b { color:var(--ink2); font-weight:600; }
  .thread .msg.asker .who b { color:var(--accent); }
  .thread .msg .txt { font-size:14.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .thread .msg.bot .txt { color:var(--muted); font-size:13.5px; }
  .thread .msg.new { background:var(--await-soft); }
  .thread .divider { display:flex; align-items:center; gap:10px; padding:4px 14px; font-size:12px; color:var(--await); font-weight:600; }
  .thread .divider::before, .thread .divider::after { content:""; flex:1; border-top:1px dashed var(--await); opacity:.6; }
  .thread .more { width:100%; border:0; border-bottom:1px solid var(--line); background:var(--card2); padding:8px; font-size:13px;
                  color:var(--accent); cursor:pointer; border-radius:8px 8px 0 0; }

  /* why: reasoning, evidence, missing */
  .md { padding:14px 16px; font-size:14.5px; line-height:1.6; overflow-wrap:anywhere; }
  .md p { margin:0 0 .8em; } .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom:0; }
  .md h4 { font-size:14px; margin:1em 0 .4em; color:var(--ink); } .md h4:first-child { margin-top:0; }
  .md ul, .md ol { margin:0 0 .8em; padding-left:22px; } .md li { margin:.2em 0; }
  .md.clamp { max-height:280px; overflow:hidden; position:relative; }
  .md.clamp::after { content:""; position:absolute; left:0; right:0; bottom:0; height:64px;
                     background:linear-gradient(to bottom, transparent, var(--card)); }
  .more-md { width:100%; border:0; border-top:1px solid var(--line); background:var(--card2); padding:8px; font-size:13px;
             color:var(--accent); cursor:pointer; border-radius:0 0 8px 8px; }
  ul.ev { list-style:none; margin:0; padding:6px 0; }
  ul.ev li { display:grid; gap:2px; padding:8px 14px; border-top:1px solid var(--line); }
  ul.ev li:first-child { border-top:0; }
  ul.ev .anchor { font-family:var(--mono); font-size:12.5px; color:var(--accent); overflow-wrap:anywhere; }
  ul.ev .note { font-size:13.5px; color:var(--ink2); line-height:1.5; }
  ul.miss { margin:0; padding:10px 14px 10px 32px; font-size:14px; line-height:1.5; color:var(--ink2); }
  ul.miss li { margin:3px 0; }
  .facts { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:1px; background:var(--line); border-radius:8px; overflow:hidden; }
  .facts div { background:var(--card); padding:10px 14px; }
  .facts b { display:block; font-size:15px; font-weight:600; color:var(--ink); }
  .facts span { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }

  /* history */
  details.hist { margin-top:22px; }
  details.hist > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; min-height:36px;
                            font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  details.hist > summary::-webkit-details-marker { display:none; }
  details.hist > summary::before { content:"▸"; font-size:11px; width:10px; }
  details.hist[open] > summary::before { content:"▾"; }
  details.hist > summary:hover { color:var(--ink); }
  table.tbl { width:100%; min-width:480px; border-collapse:collapse; font-size:13.5px; }
  table.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;
                 padding:8px 12px; border-bottom:1px solid var(--line); }
  table.tbl td { padding:8px 12px; border-top:1px solid var(--line); vertical-align:top; }
  table.tbl tr:first-child td { border-top:0; }
  table.tbl .mono { font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  .tl { list-style:none; margin:0; padding:6px 0; }
  .tl li { display:grid; grid-template-columns:64px 1fr; gap:12px; padding:6px 14px; font-size:13.5px; border-top:1px solid var(--line); }
  .tl li:first-child { border-top:0; }
  .tl .when { font-family:var(--mono); font-size:12px; color:var(--muted); padding-top:2px; }
  .tl .what b { font-weight:600; }
  .tl .what .r { color:var(--muted); }
  pre.raw { font-family:var(--mono); font-size:12.5px; line-height:1.5; margin:0; padding:12px 14px; white-space:pre-wrap; overflow-wrap:anywhere;
            max-height:420px; overflow:auto; }

  /* empty state + triage log */
  .empty { margin-top:24px; padding:24px; }
  .empty h1 { font-size:18px; margin:0 0 6px; }
  .empty p { margin:6px 0; color:var(--ink2); }
  .empty .keys { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin-top:16px; font-size:13.5px; color:var(--muted); }
  .empty kbd { font-family:var(--mono); font-size:12px; border:1px solid var(--line2); border-radius:4px; padding:0 6px; color:var(--ink2); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chipbtn { border:1px solid var(--border-in); background:var(--card); border-radius:14px; padding:3px 11px; font-size:13px;
             color:var(--ink2); cursor:pointer; min-height:30px; }
  .chipbtn[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .tblwrap { overflow-x:auto; }
  .seen-why { overflow-wrap:break-word; }

  /* toasts */
  /* Under the header, where nothing interactive lives — never over the action bar. */
  .toasts { position:fixed; left:50%; top:calc(var(--bar-h) + 12px); transform:translateX(-50%); z-index:40;
            display:flex; flex-direction:column; gap:8px; width:min(520px, calc(100vw - 32px)); pointer-events:none; }

  .toast button { pointer-events:auto; margin-left:auto; flex:none; min-width:32px; min-height:32px; display:inline-flex; align-items:center;
                  justify-content:center; background:none; border:0; border-radius:6px; color:inherit; opacity:.75; cursor:pointer; font-size:18px; line-height:1; }
  .toast button:hover { opacity:1; background:rgba(255,255,255,.12); }

  /* ---- phone: one screen at a time --------------------------------------- */
  @media (max-width: 879px) {
    .app { grid-template-columns:1fr; }
    .rail { position:static; height:auto; border-right:0; }
    .rail-list { overflow:visible; }
    .detail { padding:0 16px 16px; }
    .back { display:inline-flex; }
    body[data-view="queue"] .detail, body[data-view="queue"] .banners.detail-only { display:none; }
    body[data-view="detail"] .rail { display:none; }
    .top { gap:8px 12px; }
    .counts { display:none; }
    .dhead .links { margin-left:0; }
    .actbar .btn { flex:1 1 auto; }
    .actbar .right { margin-left:0; flex:1 1 100%; }
    .actbar .right .btn { flex:1; }
    /* Only the header stays pinned on a phone; a banner is read once and scrolls away. */
    .topwrap { position:static; }
    .top { position:sticky; top:0; z-index:20; }
    body[data-view="queue"] .skip { display:none; }
    .facts { grid-template-columns:repeat(2, 1fr); }
    .tl li { grid-template-columns:52px 1fr; }
  }
  @media (max-width: 480px) {
    .top .pulse .sub { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body data-view="queue">
<a class="skip" href="#detail" id="skip">Skip to the selected investigation</a>

<div class="topwrap">
<header class="top" role="banner">
  <a class="brand" href="#" id="brand">ralph<b>/</b>queue</a>
  <div class="pulse" id="pulse">
    <i class="dot off" id="dot" aria-hidden="true"></i><span id="pulse-text" role="status" aria-live="polite">connecting…</span><span class="sub" id="pulse-sub"></span>
  </div>
  <div class="counts" id="counts"></div>
  <nav class="top-actions" aria-label="Controls">
    <a class="btn sm quiet" href="#seen" id="nav-seen">Triage log</a>
    <button class="btn sm" id="tick" type="button">Tick now</button>
    <button class="btn sm" id="pause" type="button" aria-pressed="false">Pause</button>
  </nav>
</header>
<div class="banners" id="banners"></div>
</div>

<div class="app">
  <nav class="rail" id="rail" aria-label="Queue">
    <div class="rail-tools">
      <input type="search" id="search" placeholder="Filter by topic, channel, asker…" aria-label="Filter the queue" autocomplete="off">
    </div>
    <form class="rail-tools file" id="file-form">
      <input type="url" id="file-link" placeholder="Paste a Slack link to file it…" aria-label="File a Slack thread by hand, from a message link" autocomplete="off">
      <button class="btn sm" id="file-go" type="submit">File</button>
    </form>
    <div class="rail-list" id="rail-list"><div class="rail-empty">Loading…</div></div>
  </nav>
  <main class="detail" id="detail" tabindex="-1" aria-live="off"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var TTYD = "__RALPH_TTYD__";
  var TERMINAL = ["posted", "rejected", "superseded", "closed"];
  var DRAFT_STATES = ["awaiting_approval", "needs_review"];
  var LABEL = { awaiting_approval: "Awaiting you", needs_review: "Held for review", approved: "Approved, sending",
                posting: "Mid-send", investigating: "Investigating", needs_human: "Needs a human",
                posted: "Posted", superseded: "Superseded", rejected: "Rejected", closed: "Closed" };
  var STALE_AFTER = 600;   // seconds without a tick before the page calls it broken
  var LATE_AFTER = 180;    // seconds before the pulse turns amber

  /* ---- state --------------------------------------------------------------

     conveniences (fold state) are the only thing kept in localStorage, and

    csrf: "__RALPH_CSRF__",
    queue: null,          // /api/queue payload
    queueKey: "",         // queue minus the fields that move every tick
    details: {},          // id -> /api/inv/<id> payload
    sel: null,            // selected investigation id
    view: "queue",        // queue | detail | seen  (phone shows one at a time)
    q: "",                // rail filter text
    ui: {},               // id -> { mode, box, text, showAll, showWhy, armedAt, pending }
    edits: {},            // id -> { hash, text }
    seen: null,           // triage log payload
    seenVerdict: "",
    sseOk: true,
    focusNext: null,      // { row: id } | { detail: true } — consumed by route() after render
    touched: {},          // id -> true once the operator decided on it this session
    statuses: {},         // id -> status at the last refresh, for change toasts
    keys: (function () { try { return localStorage.getItem("ralph.keys") !== "off"; } catch (e) { return true; } })(),
  };
  var FOLD_KEY = "ralph.folded";
  var folded = (function () { try { return JSON.parse(localStorage.getItem(FOLD_KEY)) || {}; } catch (e) { return {}; } })();
  function isFolded(key) {

    return key === "done";
  }
  function setFolded(key, v) { folded[key] = v; try { localStorage.setItem(FOLD_KEY, JSON.stringify(folded)); } catch (e) { /* private window */ } }
  function ui(id) { return S.ui[id] || (S.ui[id] = { mode: "preview", box: null, text: {}, showAll: false, showWhy: false, showHist: false, armedAt: 0, armedSeq: null, focusConfirm: false, needKeyUp: false, pending: null }); }

  /* ---- small helpers ---------------------------------------------------- */

  }
  function frag(nodes) { var f = document.createDocumentFragment(); nodes.forEach(function (n) { if (n) f.appendChild(n); }); return f; }

    var b = el("button", cls, label); b.type = "button";
    if (fn) b.addEventListener("click", fn);

    return b;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  function unslack(s) { return String(s == null ? "" : s).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }
  function ago(stamp, now) {
    if (!stamp) return "?";
    var t = typeof stamp === "number" ? stamp * 1000 : Date.parse(stamp);
    if (isNaN(t)) return "?";
    var secs = Math.max(0, ((now || Date.now()) - t) / 1000);
    if (secs < 60) return Math.round(secs) + "s";
    if (secs < 5400) return Math.round(secs / 60) + "m";
    if (secs < 172800) return Math.round(secs / 3600) + "h";
    return Math.round(secs / 86400) + "d";
  }
  function fmtTime(stamp) {
    var t = typeof stamp === "number" ? stamp * 1000 : Date.parse(stamp);
    if (isNaN(t)) return String(stamp || "");
    var d = new Date(t), today = new Date();
    var hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === today.toDateString()) return hm;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + hm;
  }
  function money(x) { return "$" + Number(x || 0).toFixed(2); }
  function tsOf(id) { var p = String(id).split("-"); return p.length > 1 ? parseFloat(p[1].replace("_", ".")) : 0; }
  function askedAt(meta) { var t = parseFloat(meta.thread_ts || "0"); return t ? t : (meta.created_at ? Date.parse(meta.created_at) / 1000 : 0); }
  function shortModel(m) { return String(m || "").replace(/^claude-/, "").replace(/-\d{8}$/, ""); }
  function num(n) { return Number(n || 0).toLocaleString(); }

  /* Slack mrkdwn -> HTML. Used for the reply preview and for thread messages.
     Escapes first; emits only strong/em/s/code/pre/a/br. Broadcast forms are
     shown red because the sanitizer will refuse them. */
  function mrkdwn(src) {
    var blocks = [], SEP = "␞";
    var s = esc(src).replace(/```([\s\S]*?)```/g, function (m, code) {
      blocks.push(code.replace(/^\n/, "").replace(/\n$/, "")); return SEP + (blocks.length - 1) + SEP;
    });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
         .replace(/(^|[\s(])\*(\S(?:[^*\n]*?\S)?)\*(?=$|[\s).,!?;:'"])/gm, "$1<strong>$2</strong>")
         .replace(/(^|[\s(])_(\S(?:[^_\n]*?\S)?)_(?=$|[\s).,!?;:'"])/gm, "$1<em>$2</em>")
         .replace(/(^|[\s(])~(\S(?:[^~\n]*?\S)?)~(?=$|[\s).,!?;:'"])/gm, "$1<s>$2</s>")
         .replace(/&lt;!(here|channel|everyone)(\|[^&]*)?&gt;/g, '<span class="bcast">@$1</span>')
         .replace(/&lt;!subteam\^[^&]*&gt;/g, '<span class="bcast">@group</span>')
         .replace(/&lt;@([UW][A-Z0-9]+)(\|([^&]*))?&gt;/g, function (m, id, _p, name) { return "@" + (name || id); })
         .replace(/&lt;#[A-Z0-9]+\|([^&]*)&gt;/g, "#$1")
         .replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&<>]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>')
         .replace(/&lt;(https?:\/\/[^|&\s]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|\n)\n+/g, "$1<br>").replace(/\n/g, "<br>");
    return s.replace(new RegExp(SEP + "(\\d+)" + SEP, "g"), function (m, i) { return "<pre>" + blocks[+i] + "</pre>"; });
  }
  /* Light markdown for notes.md / summary_md. Escapes first and emits only
     h4/p/ul/ol/li/strong/em/code/pre/br — no links and no raw HTML, because
     notes quote customer-controlled thread text. */
  function md(src) {
    var lines = esc(src).replace(/\r/g, "").split("\n"), out = [], para = [], list = null, code = null;
    function inline(t) {
      return t.replace(/`([^`]+)`/g, "<code>$1</code>")
              .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
              .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<strong>$2</strong>")
              .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
    }
    function flushP() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function flushL() { if (list) { out.push("<" + list.tag + ">" + list.items.map(function (i) { return "<li>" + inline(i) + "</li>"; }).join("") + "</" + list.tag + ">"); list = null; } }
    lines.forEach(function (ln) {
      if (code !== null) { if (/^```/.test(ln)) { out.push("<pre>" + code.join("\n") + "</pre>"); code = null; } else code.push(ln); return; }
      if (/^```/.test(ln)) { flushP(); flushL(); code = []; return; }
      var h = /^#{1,6}\s+(.*)$/.exec(ln), ul = /^\s*[-*•]\s+(.*)$/.exec(ln), ol = /^\s*\d+[.)]\s+(.*)$/.exec(ln);
      if (h) { flushP(); flushL(); out.push("<h4>" + inline(h[1]) + "</h4>"); return; }
      if (ul || ol) { flushP(); var tag = ul ? "ul" : "ol"; if (!list || list.tag !== tag) { flushL(); list = { tag: tag, items: [] }; } list.items.push((ul || ol)[1]); return; }
      if (!ln.trim()) { flushP(); flushL(); return; }
      if (list && /^\s{2,}/.test(ln)) { list.items[list.items.length - 1] += " " + ln.trim(); return; }
      flushL(); para.push(ln.trim());
    });

  }

  /* ---- backend ------------------------------------------------------------
     Every network call goes through here so the artifact build (§10.4) swaps one
     object. The CSRF token is re-read from every queue payload: `ralph web`
     mints a new one per process, and a tab left open across a restart would
     otherwise have every POST refused. */
  var Backend = {
    call: function (path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ "X-Ralph-CSRF": S.csrf, "Content-Type": "application/json" }, opts.headers || {});
      return fetch(path, opts).then(function (r) {
        return r.json().catch(function () { return { ok: false, error: "HTTP " + r.status }; });
      }).catch(function (e) { return { ok: false, error: "network: " + (e && e.message || e) }; });
    },
    queue: function () { return Backend.call("/api/queue").then(function (q) { if (q && q.csrf) S.csrf = q.csrf; return q; }); },
    detail: function (id) { return Backend.call("/api/inv/" + encodeURIComponent(id)); },
    decide: function (id, payload) { return Backend.call("/api/inv/" + encodeURIComponent(id) + "/decide", { method: "POST", body: JSON.stringify(payload) }); },
    rerun: function (id) { return Backend.call("/api/inv/" + encodeURIComponent(id) + "/rerun", { method: "POST", body: "{}" }); },
    fix: function (id, repo, note) { return Backend.call("/api/inv/" + encodeURIComponent(id) + "/fix", { method: "POST", body: JSON.stringify({ repo: repo, note: note }) }); },
    reopen: function (id, reason) { return Backend.call("/api/inv/" + encodeURIComponent(id) + "/reopen", { method: "POST", body: JSON.stringify({ reason: reason }) }); },
    pause: function (on) { return Backend.call("/api/pause", { method: "POST", body: JSON.stringify({ paused: on }) }); },
    tick: function () { return Backend.call("/api/tick", { method: "POST", body: "{}" }); },
    open: function (link) { return Backend.call("/api/open", { method: "POST", body: JSON.stringify({ link: link }) }); },
    seen: function (verdict, all) { return Backend.call("/api/seen?limit=300&verdict=" + encodeURIComponent(verdict || "") + "&all=" + (all ? 1 : 0)); },
  };

  /* ---- routing: #inv/<id> · #seen · (nothing) ------------------------------ */
  function route() {

    else if (h === "#seen") { S.view = "seen"; if (!S.seen) loadSeen(); }
    else { S.view = "queue"; }
    document.body.setAttribute("data-view", S.view === "queue" ? "queue" : "detail");
    if (S.sel && !S.details[S.sel]) loadDetail(S.sel);
    Object.keys(S.ui).forEach(function (k) { S.ui[k].armedAt = 0; });   // a route change disarms
    render();
    var moved = before !== S.view + "|" + S.sel;
    if (moved) window.scrollTo(0, 0);

  function focusRow(id) { var r = document.querySelector('#rail-list .row[data-id="' + cssEsc(id) + '"]'); if (r) r.focus({ preventScroll: true }); return !!r; }

  function metaOf(id) {
    if (!S.queue) return null;
    for (var i = 0; i < S.queue.groups.length; i++) {
      var items = S.queue.groups[i].items;
      for (var j = 0; j < items.length; j++) if (items[j].id === id) return items[j];
    }
    return null;
  }

  /* ---- header: pulse, counts, banners --------------------------------------- */
  function staleSecs() {
    if (!S.queue || !S.queue.heartbeat || !S.queue.heartbeat.last_tick_at) return -1;
    // Recomputed from the wall clock, not from the payload: the whole point of
    // the red banner is to appear when nothing else on the page is changing.
    var t = Date.parse(S.queue.heartbeat.last_tick_at);
    return isNaN(t) ? -1 : (Date.now() - t) / 1000;
  }
  function renderHeader() {
    var q = S.queue; if (!q) return;
    var stale = staleSecs(), bad = stale < 0 || stale > STALE_AFTER, late = !bad && stale > LATE_AFTER;

    dot.className = "dot" + (!S.sseOk ? " off" : bad ? " bad" : q.paused ? " warn" : late ? " warn" : "");
    // Live regions are only touched when the words change: a status that is
    // re-set every 30s is re-announced every 30s.
    setText(document.getElementById("pulse-text"),
      (bad ? "not ticking" : q.paused ? "paused" : late ? "tick is late" : "ticking") + (S.sseOk ? "" : " · live updates lost, retrying"));
    setText(document.getElementById("pulse-sub"),
      stale >= 0 ? "last tick " + ago(q.heartbeat.last_tick_at) + " ago" : "no tick recorded");

    var counts = {}, live = 0;
    q.groups.forEach(function (g) { counts[g.key] = g.items.length; if (TERMINAL.indexOf(g.key) === -1) live += g.items.length; });
    var awaiting = (counts.awaiting_approval || 0) + (counts.needs_review || 0);
    var c = document.getElementById("counts");
    c.innerHTML = "<b class='" + (awaiting ? "hot" : "") + "'>" + awaiting + "</b> awaiting you · <b>" + live
      + "</b> live · <b>" + num(q.budget.runs) + "</b> " + (q.budget.runs === 1 ? "run" : "runs") + " today · <b>" + money(q.budget.cost_usd) + "</b>";
    document.title = (awaiting ? "(" + awaiting + ") " : "") + "ralph";

    var pause = document.getElementById("pause");
    if (!(typeof resumeArmed === "number" && resumeArmed)) pause.textContent = q.paused ? "Resume" : "Pause";
    pause.setAttribute("aria-pressed", String(!!q.paused));

    if (!tick.dataset.busy) { tick.disabled = !!q.paused; tick.title = q.paused ? "Resume first — the tick exits at line 1 while paused" : "Poll Slack now instead of waiting for the timer"; }

    // Banners are keyed on state and only added or removed when it flips, so a
    // role=alert node is announced once per outage, not once per render.

    var stuck = b.querySelector(".banner.stale"), paused = b.querySelector(".banner.paused");
    if (bad && !stuck) {

      n.innerHTML = "<div><b>ralph is not ticking.</b> Nothing new is being read or investigated. Approvals still post from here, but "
        + "the thread is not being watched. Check <code>systemctl --user status ralph-tick.timer</code> or press Tick now.</div>";
      b.insertBefore(n, b.firstChild);
    } else if (!bad && stuck) stuck.remove();
    if (q.paused && !paused) {
      var p = el("div", "banner warn paused");
      p.innerHTML = "<div><b>Paused.</b> Slack is still read so nothing is missed, but no agent runs and nothing posts — "
        + "an approval made now goes out when you resume.</div>";
      b.appendChild(p);

    if (typeof barHeight === "function") barHeight();
  }
  function setText(node, text) { if (node && node.textContent !== text) node.textContent = text; }

  /* ---- rail ------------------------------------------------------------------
     Rebuilt only when the queue changed in a way that matters (see refresh):
     a bare heartbeat tick costs no render, so the list never jumps under a
     cursor for nothing. Scroll position is kept across rebuilds. */

      bar.appendChild(fixBtn(meta));
      bar.appendChild(rightGroup([boxBtn(meta, "close", "Close", "btn quiet")]));
    } else if (st === "investigating") {
      var snoozed = meta.last_decision === "snooze" && meta.next_due_at && Date.parse(meta.next_due_at) > Date.now();
      var run = actBtn(meta, "rerun", meta.running ? "Agent running…" : u.pending === "rerun" ? "Queuing…" : snoozed ? "Wake now" : "Run now", "btn", function () { rerun(meta); });
      run.disabled = !!meta.running || !!u.pending; bar.appendChild(run);
      bar.appendChild(fixBtn(meta));
      bar.appendChild(rightGroup([boxBtn(meta, "close", "Close", "btn quiet")]));
    } else if (TERMINAL.indexOf(st) !== -1) {
      bar.appendChild(boxBtn(meta, "reopen", "Reopen", "btn"));
      bar.appendChild(fixBtn(meta));
    } else return null;
    if (u.pending) bar.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    return bar;
  }
  function openPr(meta) { return meta.fix && meta.fix.pr_url && meta.fix.pr_state === "OPEN" ? meta.fix : null; }
  function fixBtn(meta) {
    var fx = meta.fix || {};
    var b = boxBtn(meta, "fix", fx.running ? "Fix running…" : openPr(meta) ? "Continue the fix" : "Fix it", "btn");
    if (fx.running) b.disabled = true;
    b.title = "Run /solve on what ralph found: a worktree, the fix, a draft PR and an AI review loop. It never merges, and nothing reaches Slack.";
    return b;
  }
  function actBtn(meta, kind, label, cls, fn) { var b = mk(label, cls, fn); b.id = kind + "-" + meta.id; b.disabled = !!ui(meta.id).pending; return b; }
  function rightGroup(btns) { var r = el("span", "right"); btns.forEach(function (b) { r.appendChild(b); }); return r; }
  function boxBtn(meta, kind, label, cls) {
    var u = ui(meta.id);
    var b = mk(label, cls, function () { u.box = u.box === kind ? null : kind; u.armedAt = 0; renderDetail(true);
      var ta = document.getElementById("box-" + meta.id); if (ta) ta.focus(); });
    b.id = kind + "-" + meta.id; b.setAttribute("aria-expanded", String(u.box === kind)); b.disabled = !!u.pending;
    return b;
  }
  function composerBox(meta, full, kind) {
    var u = ui(meta.id), box = el("div", "box card"), lab = el("label"), ta = document.createElement("textarea");
    ta.id = "box-" + meta.id; lab.htmlFor = ta.id;
    var copy = {
      ask: { label: "What should change?", why: "Goes straight into the next run's prompt; the reply is redrafted with the whole thread.", ph: "Shorter, and don't promise a release date.", ok: "Send back", need: 3 },
      reject: { label: "Reject this draft — why? (optional)", why: "Nothing is posted and ralph stops working on it. The reason lands in the journal.", ph: "Wrong root cause; I'll answer this one.", ok: "Reject draft", need: 0 },
      close: { label: "Close it — why? (optional)", why: "ralph stops working on it. Reopen brings it back if the thread moves on.", ph: "Maxime answered it in the thread.", ok: "Close investigation", need: 0 },
      fix: { label: "Fix it — anything the fix should know? (optional)",
             why: openPr(meta) ? "Continues PR #" + openPr(meta).pr_number + " in " + repoName(openPr(meta).repo) + ": /solve pushes new commits to the same branch and runs the AI review again. Nothing is merged, and nothing reaches Slack."
                  : "Runs /solve in a fresh worktree: it checks ralph's root cause, writes the fix, opens a draft PR and runs AI review until that passes — often an hour. Nothing is merged, and nothing reaches Slack.",
             ph: "The cause is right; keep the change to the collector and add a regression test.", ok: "Start fix", need: 0 },
      reopen: { label: "Reopen it — what should ralph look at? (optional)", why: "ralph investigates again with the thread as it stands now. Your note goes into the next run's prompt.", ph: "They followed up asking about Windows too.", ok: "Reopen investigation", need: 0 },
    }[kind];
    lab.textContent = copy.label; box.appendChild(lab);
    box.appendChild(el("div", "why", copy.why));
    // Which repo, only when there is a choice to make: a continuing fix is
    // pinned to its PR's repo, and one configured repo needs no picker.
    var repos = (full && full.fix_repos) || [], pick = null;
    if (kind === "fix" && !openPr(meta) && repos.length > 1) {
      pick = document.createElement("select"); pick.id = "boxrepo-" + meta.id; pick.setAttribute("aria-label", "Repository to fix");
      repos.forEach(function (r) { var o = el("option", null, r.name); o.value = r.path; pick.appendChild(o); });
      pick.value = u.text.fixRepo || (meta.fix && meta.fix.repo) || repos[0].path;
      pick.disabled = !!u.pending;
      pick.addEventListener("change", function () { u.text.fixRepo = pick.value; });
      box.appendChild(pick);
    }
    ta.placeholder = copy.ph; ta.value = u.text[kind] || ""; ta.disabled = !!u.pending;
    ta.addEventListener("input", function () { u.text[kind] = ta.value; var okb = document.getElementById("boxok-" + meta.id); if (okb) okb.disabled = ta.value.trim().length < copy.need; });
    box.appendChild(ta);
    var acts = el("div", "acts");
    var okb = mk(u.pending ? "Sending…" : copy.ok, "btn " + (kind === "ask" || kind === "reopen" || kind === "fix" ? "primary" : "danger"), function () {
      if (u.pending) return;
      var reason = ta.value.trim();
      okb.disabled = true;
      if (kind === "ask") send(meta, "revise", { reason: reason }, "Sent back — the next tick redrafts with your note.");
      else if (kind === "reopen") requeue(meta, "reopen", function () { return Backend.reopen(meta.id, reason); }, "Reopened — the next tick re-reads the thread and runs again.");
      else if (kind === "fix") requeue(meta, "fix", function () { return Backend.fix(meta.id, pick ? pick.value : "", reason); }, "Fix started — the draft PR shows up here when /solve is done.");
      else if (kind === "reject") send(meta, "reject", { reason: reason || "rejected from the console" }, "Rejected. Nothing was posted.");
      else send(meta, "close", { reason: reason || "closed by hand" }, "Closed. ralph stops working on it.");
    });
    okb.id = "boxok-" + meta.id; okb.disabled = !!u.pending || ta.value.trim().length < copy.need; acts.appendChild(okb);
    var cancel = mk("Cancel", "btn", function () { u.box = null; delete u.text[kind]; renderDetail(true); focusAct(); }); cancel.id = "boxcancel-" + meta.id; cancel.disabled = !!u.pending;
    acts.appendChild(cancel);
    box.appendChild(acts);
    return box;
  }
  document.addEventListener("keyup", function () { if (S.sel && S.ui[S.sel]) S.ui[S.sel].needKeyUp = false; });
  document.addEventListener("click", function (e) {
    if (!S.sel) return; var u = S.ui[S.sel]; if (!u || !u.armedAt || Date.now() - u.armedAt < 150) return;
    if (!e.target.closest || !e.target.closest(".arm")) { u.armedAt = 0; renderDetail(true); }
  });

  function send(meta, action, extra, okMsg) {
    var u = ui(meta.id), payload = Object.assign({ action: action }, extra || {});
    if (u.pending) return Promise.resolve();
    u.pending = action; u.armedAt = 0; renderDetail(true);
    return Backend.decide(meta.id, payload).then(function (res) {
      u.pending = null;
      if (!res || !res.ok) { toast("Refused: " + ((res && res.error) || "unknown error"), "bad"); renderDetail(true); focusAct(); return; }
      u.box = null; u.text = {};
      if (action !== "snooze") delete S.edits[meta.id];
      delete S.details[meta.id];
      S.touched[meta.id] = true;
      toast(okMsg, "ok");
      return refresh().then(function () { if (S.sel === meta.id) focusDetail(); });
    });
  }
  function rerun(meta) {
    requeue(meta, "rerun", function () { return Backend.rerun(meta.id); }, "Queued — the next tick re-reads the thread and runs again.");
  }
  function requeue(meta, kind, call, okMsg) {
    var u = ui(meta.id);
    if (u.pending) return;
    u.pending = kind; renderDetail(true);
    call().then(function (res) {
      u.pending = null;
      if (!res || !res.ok) { toast("Refused: " + ((res && res.error) || "unknown error"), "bad"); renderDetail(true); focusAct(); return; }
      u.box = null; u.text = {};
      toast(okMsg, "ok");
      S.touched[meta.id] = true;
      delete S.details[meta.id];
      refresh().then(function () { if (S.sel === meta.id) focusDetail(); });
    });
  }

  /* ---- toasts ----------------------------------------------------------------- */
  function toast(msg, kind) {
    var host = document.getElementById("toasts"), t = el("div", "toast" + (kind === "bad" ? " bad" : ""));
    t.appendChild(el("span", null, msg));
    var x = mk("×", null, function () { t.remove(); }, { "aria-label": "Dismiss" }); t.appendChild(x);
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, kind === "bad" ? 12000 : 6000);
  }

  /* ---- triage log: why didn't ralph pick that up? --------------------------------- */
  function loadSeen() {
    Backend.seen(S.seenVerdict, S.seenVerdict === "excluded").then(function (r) { if (r && r.rows) { S.seen = r; if (S.view === "seen") renderDetail(); } else toast("Could not load the triage log", "bad"); });
  }
  function seenView() {
    var out = frag([]), r = S.seen;
    out.appendChild(mk("← Queue", "btn sm quiet back", function () { location.hash = ""; }));
    var head = el("div", "dhead"); head.appendChild(el("h1", null, "Triage log"));
    var m = el("div", "meta");
    m.innerHTML = r ? "<span><b>" + num(r.total) + "</b> messages seen</span>" + Object.keys(r.tally).sort().map(function (k) { return "<span>" + esc(k) + " <b>" + num(r.tally[k]) + "</b></span>"; }).join("")
                    : "Loading…";
    head.appendChild(m); out.appendChild(head);
    out.appendChild(el("p", null, "Every message ralph read gets a line: excluded by the free pre-filter (DMs, bots, your own posts), skipped, triaged as not a question, or tracked. This is how the triage threshold gets tuned."));
    var chips = el("div", "chips");
    [["", "questions only"], ["tracked", "tracked"], ["triage_no", "triage said no"], ["skip", "skipped"], ["excluded", "excluded"]].forEach(function (c) {
      chips.appendChild(mk(c[1], "chipbtn", function () { S.seenVerdict = c[0]; S.seen = null; renderDetail(true); loadSeen(); }, { "aria-pressed": String(S.seenVerdict === c[0]) }));
    });
    out.appendChild(chips);
    if (!r) return out;
    var wrap = el("div", "card tblwrap"), t = el("table", "tbl");
    t.innerHTML = "<thead><tr><th>When</th><th>Channel</th><th>Verdict</th><th>Why</th></tr></thead>";
    var tb = el("tbody");
    r.rows.forEach(function (row) {
      var tr = el("tr"), inv = row.cid + "-" + String(row.ts || "").replace(".", "_");
      tr.innerHTML = "<td class='mono' title='" + esc(row.t) + "'>" + esc(fmtTime(row.t)) + "</td><td>#" + esc(row.channel_name || row.cid) + "</td><td>"
        + (row.verdict === "tracked" ? "<a href='#inv/" + encodeURIComponent(inv) + "'>tracked</a>" : esc(row.verdict)) + "</td><td class='seen-why'>" + esc(unslack(row.why || "")) + "</td>";
      tb.appendChild(tr);
    });
    if (!r.rows.length) { var tr0 = el("tr"); tr0.innerHTML = "<td colspan='4' style='color:var(--muted)'>Nothing with that verdict.</td>"; tb.appendChild(tr0); }
    t.appendChild(tb); wrap.appendChild(t);
    var s = el("section", "sec"); s.appendChild(wrap); out.appendChild(s);
    return out;
  }

  /* ---- live updates ----------------------------------------------------------- */
  function render() { renderHeader(); renderRail(); renderDetail(); }
  function loadDetail(id) {
    return Backend.detail(id).then(function (d) {
      if (!d || !d.meta) { toast("Could not load " + id + ": " + ((d && d.error) || "unknown error"), "bad"); return; }
      // Two fetches for one id can land out of order; never let the older win.
      var have = S.details[id];
      if (have && (have.meta.journal_seq || 0) > (d.meta.journal_seq || 0)) return;
      S.details[id] = d; if (id === S.sel) renderDetail();
    });
  }
  /* Outcomes the daemon produces while the page is open, for rows the operator
     touched: the toast host is a live region, so these are announced too. */
  function announceFlips(q) {
    var now = {};
    q.groups.forEach(function (g) { g.items.forEach(function (m) { now[m.id] = m; }); });
    Object.keys(now).forEach(function (id) {
      var was = S.statuses[id], m = now[id];
      if (was && was !== m.status && (S.touched[id] || id === S.sel)) {
        var t = m.draft_topic || m.topic || id;
        if (m.status === "posted") toast("Posted: " + t, "ok");
        else if (m.status === "needs_review") toast("Held for review: " + t + (m.reason ? " — " + m.reason : ""), "bad");
        else if (m.status === "needs_human") toast("Needs a human: " + t + (m.reason ? " — " + m.reason : ""), "bad");
        else if (m.status === "awaiting_approval" && S.touched[id]) toast("New draft ready: " + t, "ok");
      }
    });
    S.statuses = {}; Object.keys(now).forEach(function (id) { S.statuses[id] = now[id].status; });
  }
  function refresh() {
    return Backend.queue().then(function (q) {
      if (!q || !q.groups) { if (q && q.error) toast(q.error, "bad"); return; }
      announceFlips(q);
      S.queue = q;
      var key = JSON.stringify(q.groups) + "|" + q.paused, changed = key !== S.queueKey; S.queueKey = key;
      renderHeader();
      if (changed) renderRail();
      Object.keys(S.details).forEach(function (k) { if (k !== S.sel) delete S.details[k]; });
      if (S.sel) {
        var m = metaOf(S.sel), d = S.details[S.sel];
        if (m && (!d || d.meta.journal_seq !== m.journal_seq || d.meta.updated_at !== m.updated_at || !!d.meta.running !== !!m.running)) return loadDetail(S.sel);
      }
      if (changed) renderDetail();
    });
  }

  document.getElementById("search").addEventListener("input", function () { S.q = this.value.trim().toLowerCase(); renderRail(); });
  var resumeArmed = 0;
  document.getElementById("pause").addEventListener("click", function () {
    var b = this, on = !(S.queue && S.queue.paused);
    if (!on) {
      // Resuming lets every approved draft post with no further human step —
      // say how many, and ask twice.
      var queued = 0;
      (S.queue ? S.queue.groups : []).forEach(function (g) { if (g.key === "approved" || g.key === "posting") queued += g.items.length; });
      if (queued && Date.now() - resumeArmed > 6000) {
        resumeArmed = Date.now(); b.textContent = "Resume — " + queued + " approved will post";
        setTimeout(function () { if (Date.now() - resumeArmed >= 6000) { resumeArmed = 0; renderHeader(); } }, 6100);
        return;
      }
    }
    resumeArmed = 0;
    Backend.pause(on).then(function (res) { if (!res || !res.ok) toast("Refused: " + ((res && res.error) || "unknown error"), "bad"); else toast(on ? "Paused. Slack is still read; nothing runs or posts." : "Resumed.", "ok"); refresh(); });
  });
  document.getElementById("tick").addEventListener("click", function () {
    var b = this; b.disabled = true; b.dataset.busy = "1"; b.textContent = "Ticking…";
    var seen = S.queue && S.queue.heartbeat && S.queue.heartbeat.last_tick_at, done = false;
    function restore() { if (done) return; done = true; b.textContent = "Tick now"; delete b.dataset.busy; b.disabled = !!(S.queue && S.queue.paused); refresh(); }
    Backend.tick().then(function (res) {
      if (!res || !res.ok) { restore(); toast((res && res.error) || "could not start a tick", "bad"); return; }
      // The tick runs detached; the heartbeat moving is what says it finished.
      var poll = setInterval(function () { Backend.queue().then(function (q) { if (q && q.heartbeat && q.heartbeat.last_tick_at !== seen) { clearInterval(poll); S.queue = q; restore(); } }); }, 1500);
      setTimeout(function () { clearInterval(poll); restore(); }, 45000);
    });
  });
  // Filing by hand reads the thread from Slack, which takes a few seconds; on
  // success the new row is opened, so what was filed is what is on screen.
  document.getElementById("file-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("file-link"), b = document.getElementById("file-go"), link = input.value.trim();
    if (!link || b.disabled) return;
    b.disabled = true; input.disabled = true; b.textContent = "Filing…";
    Backend.open(link).then(function (res) {
      b.disabled = false; input.disabled = false; b.textContent = "File";
      if (!res || !res.ok) {
        toast("Not filed: " + ((res && res.error) || "unknown error"), "bad");
        if (res && res.id) goto(res.id);
        return;
      }
      input.value = "";
      toast("Filed — the next tick investigates it.", "ok");
      refresh().then(function () { goto(res.id); });
    });
  });
  window.addEventListener("hashchange", route);
  function barHeight() { document.documentElement.style.setProperty("--bar-h", document.querySelector(".topwrap").offsetHeight + "px"); }
  window.addEventListener("resize", barHeight); barHeight();
  setInterval(function () { if (S.queue) { renderHeader(); refreshAges(); } }, 30000);
  setInterval(refresh, 60000);   // safety net, independent of the event stream

  route();
  refresh().then(function () {
    if (!S.sel && S.view === "queue" && window.innerWidth >= 880 && S.queue) {
      for (var i = 0; i < S.queue.groups.length; i++) {
        var g = S.queue.groups[i];
        if (DRAFT_STATES.indexOf(g.key) !== -1 && g.items.length) { goto(g.items[0].id); break; }
      }
    }
  });
  try {
    var es = new EventSource("/api/events");
    es.addEventListener("changed", function () { refresh(); });
    // Every (re)connection catches up: a change that landed while the stream
    // was down, or between the first fetch and the handshake, is not announced
    // by the seeded server. queueKey dedups, so an unchanged queue costs no render.
    es.onopen = function () { S.sseOk = true; renderHeader(); refresh(); };
    es.onerror = function () { if (S.sseOk) { S.sseOk = false; renderHeader(); } };
  } catch (e) { setInterval(refresh, 5000); }
})();
</script>
</body>
