# Checks every push and pull request: Rust formatting, lints and tests; plugin tests and
# Python linters.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin host's tests start small Python and shell scripts.
      - run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [plugin/discord, plugin/email, plugin/documents, deploy]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: python -m unittest -v
      - run: uvx ruff check .
      # Errors fail the build; warnings are reported but allowed (failOnWarnings: false in
      # each directory's pyrightconfig.json; basedpyright otherwise fails on them in CI).
      - run: uvx basedpyright .
